[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cairn-flash"
version = "0.2.0"
description = "Fail-safe Android flashing: verified writes, resumable journals, and recovery-first planning."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hassan Tsuma", email = "karungwahassan03@gmail.com" }]
keywords = ["android", "fastboot", "flashing", "avb", "recovery", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Recovery Tools",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "TID"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"src/cairn/tools/runner.py" = ["S603", "S607"]
"tools/mutation_check.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cairn"]
