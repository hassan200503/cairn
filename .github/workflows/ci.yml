name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  sparse-oracle:
    name: Sparse oracle (AOSP libsparse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y android-sdk-libsparse-utils
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_sparse_oracle.py

  super-oracle:
    name: Super oracle (AOSP lpmake from pinned source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/oracle/build_lpmake.sh "$HOME/.cache/cairn-aosp-oracle" "$RUNNER_TEMP/lpmake-build"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_super_meta.py
        env:
          CAIRN_LPMAKE: ${{ runner.temp }}/lpmake-build/bin/lpmake

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
